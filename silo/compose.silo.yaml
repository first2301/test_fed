services:
  # ============================================
  # Silo 1
  # ============================================
  silo-1:
    build:
      context: .
      dockerfile: Dockerfile.silo
    container_name: silo-1
    privileged: true  # ★ 필수: Docker-in-Docker 실행 권한
    ports:
      - "2223:22"     # 호스트 2223 -> 컨테이너 SSH
      - "2371:2375"   # 호스트 2371 -> 컨테이너 Docker API
      - "9000:9000"   # MinIO API (S3 호환)
      - "9001:9001"   # MinIO Console (웹 UI)
    volumes:
      - ./data/silo1:/var/lib/docker # ★ 데이터 격리: Silo 1 전용 저장소
      - ./data/minio-silo1:/data     # MinIO 데이터 저장소
    networks:
      - fed-net
    environment:
      - RUN_MINIO=true
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio1234
      - MINIO_API_PORT=9000
      - MINIO_CONSOLE_PORT=9001
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================
  # Silo 2
  # ============================================
  silo-2:
    build:
      context: .
      dockerfile: Dockerfile.silo
    container_name: silo-2
    privileged: true
    ports:
      - "2224:22"
      - "2372:2375"
      - "9002:9000"   # MinIO API (S3 호환, 포트 충돌 방지)
      - "9003:9001"   # MinIO Console (웹 UI, 포트 충돌 방지)
    volumes:
      - ./data/silo2:/var/lib/docker # ★ 데이터 격리: Silo 2 전용 저장소
      - ./data/minio-silo2:/data     # MinIO 데이터 저장소
    networks:
      - fed-net
    environment:
      - RUN_MINIO=true
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio1234
      - MINIO_API_PORT=9002
      - MINIO_CONSOLE_PORT=9003
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================
  # Silo 3 ~ 6 (패턴 반복)
  # ============================================
  silo-3:
    build:
      context: .
      dockerfile: Dockerfile.silo
    container_name: silo-3
    privileged: true
    ports:
      - "2225:22"
      - "2373:2375"
      - "9004:9000"   # MinIO API (S3 호환)
      - "9005:9001"   # MinIO Console (웹 UI)
    volumes:
      - ./data/silo3:/var/lib/docker
      - ./data/minio-silo3:/data     # MinIO 데이터 저장소
    networks:
      - fed-net
    environment:
      - RUN_MINIO=true
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio1234
      - MINIO_API_PORT=9004
      - MINIO_CONSOLE_PORT=9005
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G


networks:
  fed-net:
    driver: bridge
